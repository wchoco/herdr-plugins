# A stand-in for yubi's overlay, used by capture-events.py: its pane only
# sleeps, so every captured event comes from herdr itself.
id = "wchoco.yubi-probe"
name = "yubi-probe"
version = "0.0.0"
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

[[panes]]
id = "ui"
title = "yubi-probe"
placement = "overlay"
command = ["sleep", "3600"]
